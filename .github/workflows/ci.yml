name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSE_FILE: infra/docker/docker-compose.yml

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-python-env
      - run: make lint

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-python-env
        with:
          groups: dev llm-engine
      - run: make typecheck

  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-python-env
        with:
          groups: dev llm-engine
      - run: cp .env.example .env
      - run: .venv/bin/python -m pytest tests/unit/ --cov=src --cov-report=html --cov-report=term
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: htmlcov/

  integration-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-python-env
        with:
          groups: dev llm-engine
      - name: Resolve HF tokenizer model
        id: tokenizer
        run: |
          cp .env.example .env
          model=$(grep -m1 '^CHUNKING_TOKENIZER_MODEL=' .env | cut -d= -f2-)
          echo "model=${model:-nomic-ai/nomic-embed-text-v1.5}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-tokenizer-${{ steps.tokenizer.outputs.model }}
      - name: Start backing services
        run: |
          docker compose --env-file .env up -d --wait \
            postgres pgbouncer redis-app redis-broker qdrant opensearch
      - run: make test-integration
      - name: Tear down services
        if: always()
        run: docker compose --env-file .env down -v

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-python-env
        with:
          groups: dev llm-engine
      - name: pip-audit
        # Accepted findings, grouped by what unblocks them. Drop entries once fixable.
        # TODO: re-add --strict once the existing CVE backlog is triaged/fixed.
        run: |
          ignores=(
            # docling==2.111.0 is pinned (private-method override); fixes need docling>=2.132.
            PYSEC-2026-4189 PYSEC-2026-4190 PYSEC-2026-4191 PYSEC-2026-4192 PYSEC-2026-4193
            PYSEC-2026-4194 PYSEC-2026-4195 PYSEC-2026-4196 PYSEC-2026-4207 PYSEC-2026-4208
            # docling-slim: same pin as docling.
            PYSEC-2026-4209 PYSEC-2026-4210 PYSEC-2026-4211 PYSEC-2026-4212 PYSEC-2026-4213
            PYSEC-2026-4214 PYSEC-2026-4215 PYSEC-2026-4216
            # pillow: fixes need 13.x, but docling 2.111's deps require pillow<13.
            PYSEC-2026-4326 PYSEC-2026-4327 PYSEC-2026-4328 GHSA-78g4-xqwv-q3g8
            CVE-2026-96636 CVE-2026-96637 CVE-2026-96638 CVE-2026-96639 CVE-2026-96640
            CVE-2026-96641 CVE-2026-96642 CVE-2026-96643 CVE-2026-96644 CVE-2026-96778
            CVE-2026-112390 CVE-2026-112391 CVE-2026-112393 CVE-2026-112395 CVE-2026-112397
            CVE-2026-112398 CVE-2026-112399 CVE-2026-112400 CVE-2026-112401 CVE-2026-112402
            CVE-2026-112404 CVE-2026-112405 CVE-2026-112406 CVE-2026-112891 CVE-2026-112892
            CVE-2026-112893 CVE-2026-112894 CVE-2026-112895 CVE-2026-112896 CVE-2026-112897
            CVE-2026-112899 CVE-2026-112900 CVE-2026-112901 CVE-2026-114501
            # transformers: fix needs 5.10, docling's deps cap it lower.
            PYSEC-2026-3929
            # No fix upstream as of 2026-10-27.
            PYSEC-2026-3804 PYSEC-2026-4174
            # torch/transformers: no compatible fix yet.
            PYSEC-2026-139 CVE-2025-3000 PYSEC-2025-217 CVE-2026-1839 CVE-2026-4372
            PYSEC-2026-2290
          )
          uv export --frozen --no-hashes --group dev --group llm-engine -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt $(printf -- '--ignore-vuln %s ' "${ignores[@]}")
      - name: semgrep
        run: uvx semgrep scan --config p/python --config p/secrets --error

  docker:
    # Cheap static checks only — no image builds.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Parse the compose file with the .env.example values substituted in and fail on
      # any schema/interpolation error (unknown keys, bad types, unset ${VAR} with no
      # default). Catches a broken compose file without starting any container.
      - name: Validate compose config
        run: |
          cp .env.example .env
          docker compose --env-file .env config --quiet
      # hadolint = a Dockerfile linter. It parses each Dockerfile's instructions and
      # flags anti-patterns and mistakes (unpinned `apt-get install` versions, missing
      # `--no-install-recommends`, `ADD` where `COPY` suffices, running as root, shell
      # form pitfalls, etc.), plus ShellCheck on every RUN script. failure-threshold:
      # error means only error-level rules break CI; warnings/info are informational.
      - name: Lint Dockerfile.api (hadolint)
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: infra/docker/Dockerfile.api
          failure-threshold: error
      - name: Lint Dockerfile.worker (hadolint)
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: infra/docker/Dockerfile.worker
          failure-threshold: error
      - name: Lint Dockerfile.frontend (hadolint)
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: infra/docker/Dockerfile.frontend
          failure-threshold: error
      # trivy `config` scan = infrastructure-as-code misconfiguration scanner. Unlike
      # hadolint (style/best-practice), this looks for SECURITY misconfigurations in
      # Dockerfiles/compose/IaC across the repo (scan-ref: .) — e.g. images without a
      # pinned digest, secrets baked into layers, over-broad privileges. Fails the job
      # (exit-code: 1) only on HIGH/CRITICAL findings; .venv and node_modules skipped.
      # infra/k8s is skipped until its manifests get securityContext hardening.
      - name: Scan Dockerfiles for misconfigurations (trivy config)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          skip-dirs: .venv,node_modules,infra/k8s
          exit-code: 1
          severity: HIGH,CRITICAL

  frontend-typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/ui/package-lock.json
      - run: npm ci
        working-directory: src/ui
      - run: npx tsc --noEmit
        working-directory: src/ui

  # --------------------
  # All checks passed gate
  # --------------------
  ci-success:
    name: CI Success
    needs:
      - lint
      - typecheck
      - unit-tests
      - integration-tests
      - security
      - docker
      - frontend-typecheck
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          results=(
            "${{ needs.lint.result }}"
            "${{ needs.typecheck.result }}"
            "${{ needs.unit-tests.result }}"
            "${{ needs.integration-tests.result }}"
            "${{ needs.security.result }}"
            "${{ needs.docker.result }}"
            "${{ needs.frontend-typecheck.result }}"
          )
          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "One or more required jobs failed"
              exit 1
            fi
          done
          echo "All CI checks passed!"
