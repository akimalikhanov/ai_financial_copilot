defaults:
  params:
    temperature: 0.2
    max_tokens: 6000
    # seed: null
    # reasoning_effort: null
    # verbosity: null
  stream: true

models:
  # === Cloud adapters ===
  - id: gpt-5.2
    label: "OpenAI GPT-5.2"
    provider: openai
    model_name: "gpt-5.2"
    pricing:
      currency: USD
      unit: per_1k_tokens
      input: ${GPT5_2_INPUT_PRICE:-0.00175}
      output: ${GPT5_2_OUTPUT_PRICE:-0.01400}
      cached_input: ${GPT5_2_CACHED_INPUT_PRICE:-0.000175}
      cached_output: null
      rounding: exact
      effective: 2025-12-11
      notes: "OpenAI standard pricing (per 1M: $1.75 in, $0.175 cached in, $14 out)."
    capabilities:
      streaming: true
      tool_calling: true
      vision: true
    params_override: {temperature: 1.0, max_tokens: 6000, verbosity: high, reasoning_effort: high}
    # Same-provider fallback: smallest quality drop, still a reasoning-tier model.
    # Covers capacity/rollout issues on the gpt-5.2 SKU specifically, not a full
    # OpenAI outage. See llm_router.py LLMRouter.get_with_fallback / FallbackStream.
    fallback_model: gpt-5-mini

  - id: gpt-5-mini
    label: "OpenAI GPT-5-mini"
    provider: openai
    model_name: "gpt-5-mini"
    pricing:
      currency: USD
      unit: per_1k_tokens
      input: ${GPT5_MINI_INPUT_PRICE:-0.00025}
      output: ${GPT5_MINI_OUTPUT_PRICE:-0.00200}
      cached_input: ${GPT5_MINI_CACHED_INPUT_PRICE:-0.000025}
      cached_output: null
      rounding: exact
      effective: 2025-12-11
      notes: "OpenAI standard pricing (per 1M: $0.25 in, $0.025 cached in, $2 out)."
    capabilities:
      streaming: true
      tool_calling: true
      vision: true
    # max_tokens maps to max_completion_tokens for GPT-5 models, which counts reasoning
    # tokens too. The global default (2000) starves the answer at high reasoning_effort
    # (reasoning consumes the whole budget -> empty output), so give reasoning room here.
    #
    # reasoning_effort bumped to medium (was low): traces showed the agent loop opening
    # wide aspect sets but never issuing gap-targeted follow-up searches or acting on its
    # own medium/low confidence labels before reporting - a multi-step self-monitoring
    # judgment low effort was skipping, not a prompt wording issue (see agent/loop.py
    # analytical-shape traces from 2026-08-05). gpt-5.4-mini was tried first but OpenAI
    # rejects reasoning_effort + tool calling together on /v1/chat/completions for that
    # model (needs /v1/responses, which OpenAIAdapter doesn't implement) - stuck with
    # gpt-5-mini, which supports this combination on chat/completions today.
    params_override: {temperature: 1.0, reasoning_effort: medium, verbosity: low, max_tokens: 6000}
    # Same-provider fallback for the agent tool-calling loop (AGENT_TOOL_MODEL).
    # gpt-4o-mini has no reasoning_effort/verbosity tuning, so agent reasoning
    # quality drops, but the loop keeps functioning instead of failing outright.
    fallback_model: gpt-4o-mini

  - id: gpt-4o-mini
    label: "OpenAI GPT-4o-mini"
    provider: openai
    model_name: "gpt-4o-mini"
    pricing:
      currency: USD
      unit: per_1k_tokens
      input: ${GPT4O_MINI_INPUT_PRICE:-0.00015}
      output: ${GPT4O_MINI_OUTPUT_PRICE:-0.00060}
      cached_input: ${GPT4O_MINI_CACHED_INPUT_PRICE:-0.000075}
      cached_output: null
      rounding: exact
      effective: 2025-07-18
      notes: "OpenAI standard pricing (per 1M: $0.15 in, $0.075 cached in, $0.60 out)."
    capabilities:
      streaming: true
      tool_calling: true
      vision: true
    params_override: {}
    # Cross-provider fallback: mutual pair with gemini-3.7-flash's fallback below,
    # so each model covers the other's outage. Costs more than gpt-4o-mini per
    # token, but only while the fallback is actually in use.
    fallback_model: gemini-3.7-flash

  # === Google Gemini adapters ===

  - id: gemini-3.7-flash
    label: "Gemini 3.7 Flash"
    provider: google
    model_name: "gemini-3.7-flash"
    pricing:
      currency: USD
      unit: per_1k_tokens
      input: ${GEMINI_FLASH_INPUT_PRICE:-0.00075}
      output: ${GEMINI_FLASH_OUTPUT_PRICE:-0.00375}
      cached_input: ${GEMINI_FLASH_CACHE_PRICE:-0.000075}
      cached_output: null
      rounding: exact
      effective: 2026-09-01
      # Promotional pricing: doubles on 2027-01-01 to $1.50 in, $7.50 out, $0.15 caching.
      notes: "Paid tier (per 1M: $0.75 in, $3.75 out, caching $0.075) through 2026-12-31."
    capabilities:
      streaming: true
      tool_calling: true
      vision: true
    params_override: {}
    # If gemini-3.7-flash errors on a retryable condition (e.g. 503), fall back
    # to this model rather than failing the whole chat turn. See llm_router.py
    # LLMRouter.get_with_fallback / FallbackStream.
    fallback_model: gpt-4o-mini

  # === Local vLLM adapters ===
  - id: qwen3-8b
    label: "Qwen3-8B-AWQ"
    provider: vllm
    model_path: "Qwen/Qwen3-8B-AWQ"
    server:
      host: "${QWEN_SERVER_HOST:-localhost}"
      port: "${QWEN_SERVER_PORT:-8001}"
      base_path: "/v1"
    include_usage: true
    pricing:
      currency: USD
      unit: local
      cost: 0.0
      notes: "Running on self-hosted GPU with vLLM. No API billing."
    capabilities:
      streaming: true
      tool_calling: true
      # Text-only checkpoint; the vision variant is a separate model (Qwen3-VL).
      vision: false
    params_override: {max_tokens: 1024}
