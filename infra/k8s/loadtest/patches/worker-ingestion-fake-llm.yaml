# The chat load test does not drive ingestion, but the table summarizer and picture enricher
# make LLM calls — so patch this too rather than leave one workload able to spend real money.
# See docs/notes/loadtest-concepts.md §8.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-ingestion
spec:
  template:
    spec:
      containers:
        - name: worker-ingestion
          env:
            - name: MODELS_CONFIG_PATH
              value: infra/config/loadtest/models.yaml
            # Fail closed: refuses to build a real adapter even if this pod somehow loads
            # the production models.yaml. See _build_adapter in src/services/llm_router.py.
            - name: FAKE_LLM_ONLY
              value: "true"
            - name: PICTURE_ENRICHER_ENABLED
              value: "false"
          volumeMounts:
            - name: loadtest-models-config
              mountPath: /app/infra/config/loadtest
              readOnly: true
      volumes:
        - name: loadtest-models-config
          configMap:
            name: loadtest-models-config
