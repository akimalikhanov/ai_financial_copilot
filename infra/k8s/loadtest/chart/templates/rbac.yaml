# For the Job's await-fake-llm-rollout gate: `kubectl rollout status` reads Deployments and the
# ReplicaSets they own, nothing more.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loadtest
  namespace: {{ include "loadtest.namespace" . }}
  labels:
    {{- include "loadtest.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loadtest-rollout-reader
  namespace: {{ include "loadtest.namespace" . }}
  labels:
    {{- include "loadtest.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loadtest-rollout-reader
  namespace: {{ include "loadtest.namespace" . }}
  labels:
    {{- include "loadtest.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: loadtest
    namespace: {{ include "loadtest.namespace" . }}
roleRef:
  kind: Role
  name: loadtest-rollout-reader
  apiGroup: rbac.authorization.k8s.io
