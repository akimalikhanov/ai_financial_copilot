# Shipped as ConfigMaps, so a scenario edit is an install, not an image rebuild. A fresh release
# per run means the Job always mounts the current version.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loadtest-locustfile
  namespace: {{ include "loadtest.namespace" . }}
  labels:
    {{- include "loadtest.labels" . | nindent 4 }}
data:
  {{- (.Files.Glob "files/locustfile.py").AsConfig | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loadtest-params
  namespace: {{ include "loadtest.namespace" . }}
  labels:
    {{- include "loadtest.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.params }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
