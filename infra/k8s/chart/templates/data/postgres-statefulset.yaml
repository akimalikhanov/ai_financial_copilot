apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "postgres") | nindent 4 }}
spec:
  serviceName: postgres-headless     # must match the headless Service name
  replicas: 1
  selector:
    matchLabels:
      {{- include "copilot.selectorLabels" (dict "name" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "copilot.podLabels" (dict "name" "postgres") | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
        checksum/config: {{ include (print $.Template.BasePath "/data/postgres-configmaps.yaml") . | sha256sum }}
        checksum/secrets: {{ .Values.secretsChecksum | quote }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          # Image default is 100, and pgbouncer can now open up to 120 server connections
          # (app 60 + langfuse 30 + postgres 30). Below this, the pool hits a Postgres refusal.
          args: ["postgres", "-c", "max_connections=200"]
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - configMapRef: { name: postgres-config }   # POSTGRES_DB, APP_DB, APP_DB_USER, LANGFUSE_DB, LANGFUSE_DB_USER
            - secretRef:    { name: {{ .Values.secrets.postgres }} }   # POSTGRES_USER/PASSWORD, APP_DB_PASSWORD, LANGFUSE_DB_PASSWORD
          env:
            # The image writes PGDATA at the volume root; keep the subdir, it is mandatory on EBS.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 20            # laxer than readiness — avoid killing a slow-starting store
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
        # Engine-level metrics, so load-test scenarios can be measured after the fact.
        # --collector.stat_activity is off by default and is why this sidecar exists: it emits
        # pg_stat_activity_count{datname,state}, including state="idle in transaction".
        # The xmin horizon is not built in, hence the query file. --extend.query-path is
        # deprecated but the only mechanism that loads custom queries in v0.20.x.
        - name: postgres-exporter
          image: {{ .Values.exporterImages.postgres }}
          args:
            - --collector.stat_activity
            - --collector.database_wraparound
            - --extend.query-path=/etc/postgres-exporter/postgres-exporter-queries.yaml
          ports:
            - name: metrics
              containerPort: 9187
          env:
            # Superuser: pg_stat_activity otherwise hides other users' backends. $(VAR) is
            # expanded by kubelet, not a shell.
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.postgres }}, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.postgres }}, key: POSTGRES_PASSWORD } }
            - name: DATA_SOURCE_NAME
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@127.0.0.1:5432/postgres?sslmode=disable"
          volumeMounts:
            - name: exporter-queries
              mountPath: /etc/postgres-exporter
              readOnly: true
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits:   { cpu: "100m", memory: "64Mi" }
      volumes:
        - name: exporter-queries
          configMap:
            name: postgres-exporter-queries
        - name: initdb
          configMap:
            name: postgres-initdb
            defaultMode: 0755           # ENTRYPOINT only executes *.sh that are executable
  # Immutable on the live object: keep the part-of label and omit storageClassName on kind.
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/part-of: copilot
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- include "copilot.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
