apiVersion: v1
kind: Service
metadata:
  name: pgbouncer              # <- the name the app dials (APP_DB_HOST=pgbouncer)
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "pgbouncer") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "copilot.selectorLabels" (dict "name" "pgbouncer") | nindent 4 }}
  ports:
    - name: pgbouncer
      port: 6432
      targetPort: 6432
