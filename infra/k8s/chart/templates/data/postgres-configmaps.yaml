apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "postgres") | nindent 4 }}
data:
  {{- (.Files.Glob "files/data/initdb/*.sh").AsConfig | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "postgres") | nindent 4 }}
data:
  POSTGRES_DB: postgres
  APP_DB: app
  APP_DB_USER: app
  LANGFUSE_DB: langfuse
  LANGFUSE_DB_USER: langfuse
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-exporter-queries
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "postgres") | nindent 4 }}
data:
  {{- (.Files.Glob "files/data/postgres-exporter-queries.yaml").AsConfig | nindent 2 }}
