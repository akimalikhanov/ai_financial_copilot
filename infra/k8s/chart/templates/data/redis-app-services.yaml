apiVersion: v1
kind: Service
metadata:
  name: redis-app-headless
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "redis-app") | nindent 4 }}
spec:
  clusterIP: None            # headless: no VIP, DNS returns pod IPs directly
  selector:
    {{- include "copilot.selectorLabels" (dict "name" "redis-app") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-app              # <- REDIS_APP_HOST, the name the api/workers dial
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "redis-app") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "copilot.selectorLabels" (dict "name" "redis-app") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
