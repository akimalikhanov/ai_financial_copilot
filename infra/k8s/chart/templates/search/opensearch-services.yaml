apiVersion: v1
kind: Service
metadata:
  name: opensearch-headless
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "opensearch") | nindent 4 }}
spec:
  clusterIP: None            # headless: no VIP, DNS returns pod IPs directly
  selector:
    {{- include "copilot.selectorLabels" (dict "name" "opensearch") | nindent 4 }}
  ports:
    - name: http
      port: 9200
      targetPort: 9200
    - name: metrics
      port: 9600
      targetPort: 9600
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch              # <- the name the api/workers/dashboards dial
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "opensearch") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "copilot.selectorLabels" (dict "name" "opensearch") | nindent 4 }}
  ports:
    - name: http
      port: 9200
      targetPort: 9200
    - name: metrics
      port: 9600
      targetPort: 9600
