apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "opensearch") | nindent 4 }}
spec:
  serviceName: opensearch-headless     # must match the headless Service name
  replicas: 1
  selector:
    matchLabels:
      {{- include "copilot.selectorLabels" (dict "name" "opensearch") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "copilot.podLabels" (dict "name" "opensearch") | nindent 8 }}
    spec:
      {{- if .Values.sysctlInit.enabled }}
      initContainers:
        {{- include "copilot.sysctlInitContainer" . | nindent 8 }}
      {{- end }}
      containers:
        - name: opensearch
          image: {{ .Values.opensearch.image }}
          env:
            - name: discovery.type
              value: single-node
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms{{ .Values.opensearch.heap }} -Xmx{{ .Values.opensearch.heap }}"
            # No memory_lock: K8s has no per-pod ulimits, so compose's memlock can't be ported.
            - name: DISABLE_SECURITY_PLUGIN     # DEV ONLY
              value: "true"
          ports:
            - name: http
              containerPort: 9200
            - name: metrics
              containerPort: 9600
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "curl -fsS http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "curl -fsS http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
            initialDelaySeconds: 60
            periodSeconds: 30            # laxer than readiness — avoid killing a slow-starting store
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.opensearch.resources | nindent 12 }}
  # Immutable on the live object: keep the part-of label and omit storageClassName on kind.
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/part-of: copilot
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- include "copilot.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.opensearch.persistence.size }}
