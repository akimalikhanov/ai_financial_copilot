apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-headless
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "elasticsearch") | nindent 4 }}
spec:
  clusterIP: None            # headless: no VIP, DNS returns pod IPs directly
  selector:
    {{- include "copilot.selectorLabels" (dict "name" "elasticsearch") | nindent 4 }}
  ports:
    - name: http
      port: 9200
      targetPort: 9200
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch          # <- the name Fluent Bit / es-bootstrap dial, on 9200 in-cluster
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "elasticsearch") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "copilot.selectorLabels" (dict "name" "elasticsearch") | nindent 4 }}
  ports:
    - name: http
      port: 9200
      targetPort: 9200
