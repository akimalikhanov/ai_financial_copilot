apiVersion: v1
kind: Service
metadata:
  name: qdrant-headless
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "qdrant") | nindent 4 }}
spec:
  clusterIP: None            # headless: no VIP, DNS returns pod IPs directly
  selector:
    {{- include "copilot.selectorLabels" (dict "name" "qdrant") | nindent 4 }}
  ports:
    - name: http
      port: 6333
      targetPort: 6333
    - name: grpc
      port: 6334
      targetPort: 6334
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant              # <- QDRANT_HOST, the name the api/workers dial
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "qdrant") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "copilot.selectorLabels" (dict "name" "qdrant") | nindent 4 }}
  ports:
    - name: http
      port: 6333
      targetPort: 6333
    - name: grpc
      port: 6334
      targetPort: 6334
