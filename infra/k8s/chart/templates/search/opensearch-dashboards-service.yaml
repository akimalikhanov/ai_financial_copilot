{{- if .Values.opensearchDashboards.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: opensearch-dashboards
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "opensearch-dashboards") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "copilot.selectorLabels" (dict "name" "opensearch-dashboards") | nindent 4 }}
  ports:
    - name: http
      port: 5601
      targetPort: 5601
{{- end }}
