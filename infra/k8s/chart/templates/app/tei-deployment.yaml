apiVersion: apps/v1
kind: Deployment
metadata:
  name: tei
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "tei") | nindent 4 }}
spec:
  replicas: {{ .Values.tei.replicas }}
  strategy:
    type: Recreate               # ReadWriteOnce model cache
  selector:
    matchLabels:
      {{- include "copilot.selectorLabels" (dict "name" "tei") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "copilot.podLabels" (dict "name" "tei" "component" "tei") | nindent 8 }}
      annotations:
        checksum/secrets: {{ .Values.secretsChecksum | quote }}
    spec:
      # The `prometheus` Service's injected PROMETHEUS_PORT=tcp://... crashes TEI, which parses it.
      enableServiceLinks: false
      {{- include "copilot.gpuScheduling" . | nindent 6 }}
      containers:
        - name: tei
          image: {{ .Values.tei.image }}
          args:
            - --model-id
            - {{ .Values.tei.modelId }}
            - --dtype
            - float16
            - --max-batch-tokens
            - "16384"
            - --max-batch-requests
            - "16"
            - --max-client-batch-size
            - "64"
            - --payload-limit
            - "10000000"
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - secretRef: { name: {{ .Values.secrets.app }} }   # HF_TOKEN
          volumeMounts:
            - name: data
              mountPath: /data
          # Cold start downloads the model to the PVC, hence the long failure budget.
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              {{- toYaml .Values.tei.resources.requests | nindent 14 }}
            limits:
              {{- toYaml .Values.tei.resources.limits | nindent 14 }}
              {{- if .Values.gpu.enabled }}
              nvidia.com/gpu: 1
              {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tei-data
