apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "copilot.selectorLabels" (dict "name" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "copilot.podLabels" (dict "name" "frontend") | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: {{ include "copilot.appImage" (dict "root" $ "name" "frontend") | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          # envsubst'd into the image's nginx.k8s.conf.template (see Dockerfile.frontend).
          env:
            - name: API_HOST
              value: api
            - name: API_PORT
              value: "8000"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
