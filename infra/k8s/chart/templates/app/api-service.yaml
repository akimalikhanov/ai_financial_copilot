apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "api") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "copilot.selectorLabels" (dict "name" "api") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: 8000
