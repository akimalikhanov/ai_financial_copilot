apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hf-model-cache
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "ingestion_worker") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep    # survives helm uninstall; GBs of models
spec:
  # ReadWriteOnce: worker-ingestion and the model-preload hook share it on one node.
  accessModes: [ReadWriteOnce]
  {{- include "copilot.storageClass" . | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.workerIngestion.modelCache.size }}
