apiVersion: v1
kind: Service
metadata:
  name: tei-embedder
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "tei-embedder") | nindent 4 }}
spec:
  selector:
    {{- include "copilot.selectorLabels" (dict "name" "tei-embedder") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: 80
