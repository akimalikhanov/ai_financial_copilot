apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tei-embedder-data
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "tei-embedder") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep    # survives helm uninstall; saves a model re-download
spec:
  accessModes: [ReadWriteOnce]
  {{- include "copilot.storageClass" . | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.teiEmbedder.persistence.size }}
