apiVersion: v1
kind: Service
metadata:
  name: worker-ingestion
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "ingestion_worker") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "copilot.selectorLabels" (dict "name" "ingestion_worker") | nindent 4 }}
  ports:
    - name: metrics
      port: 9101
      targetPort: 9101
