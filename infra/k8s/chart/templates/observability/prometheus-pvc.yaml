apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "prometheus") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep    # survives helm uninstall; metrics history
spec:
  accessModes: ["ReadWriteOnce"]
  {{- include "copilot.storageClass" . | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.prometheus.persistence.size }}
