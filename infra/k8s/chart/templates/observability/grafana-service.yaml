apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "grafana") | nindent 4 }}
spec:
  selector:
    {{- include "copilot.selectorLabels" (dict "name" "grafana") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: 3000
