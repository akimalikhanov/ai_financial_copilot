apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "prometheus") | nindent 4 }}
spec:
  selector:
    {{- include "copilot.selectorLabels" (dict "name" "prometheus") | nindent 4 }}
  ports:
    - name: http
      port: 9090
      targetPort: 9090
