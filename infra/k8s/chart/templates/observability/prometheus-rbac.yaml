apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "prometheus") | nindent 4 }}
---
# Cluster-scoped names are global: prefixed so they can't collide with another install.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "copilot.namespace" . }}-prometheus
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "prometheus") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "nodes"]
    verbs: ["get", "list", "watch"]
  # The kubernetes-cadvisor job scrapes through the API server's node proxy.
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "copilot.namespace" . }}-prometheus
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "prometheus") | nindent 4 }}
roleRef:                     # immutable: rename the role and the binding together
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "copilot.namespace" . }}-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ include "copilot.namespace" . }}
