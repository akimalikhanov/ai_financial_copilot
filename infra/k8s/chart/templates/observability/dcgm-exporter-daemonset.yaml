{{- if .Values.dcgmExporter.enabled }}
# GPU utilization/memory/temperature for Prometheus; the pod annotations put it in pod SD.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dcgm-exporter
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "dcgm-exporter") | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "copilot.selectorLabels" (dict "name" "dcgm-exporter") | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "copilot.podLabels" (dict "name" "dcgm-exporter") | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9400"
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      # Only the node the device plugin advertises nvidia.com/gpu on.
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: dcgm-exporter
          image: {{ .Values.dcgmExporter.image }}
          ports:
            - name: metrics
              containerPort: 9400
          securityContext:
            privileged: true
          resources:
            {{- toYaml .Values.dcgmExporter.resources | nindent 12 }}
{{- end }}
