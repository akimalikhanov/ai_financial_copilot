apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "fluent-bit") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "copilot.namespace" . }}-fluent-bit
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "fluent-bit") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "copilot.namespace" . }}-fluent-bit
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "fluent-bit") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "copilot.namespace" . }}-fluent-bit
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: {{ include "copilot.namespace" . }}
