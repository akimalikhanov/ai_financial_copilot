apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "kube-state-metrics") | nindent 4 }}
spec:
  selector:
    {{- include "copilot.selectorLabels" (dict "name" "kube-state-metrics") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
