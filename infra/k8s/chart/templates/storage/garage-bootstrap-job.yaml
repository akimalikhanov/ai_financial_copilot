apiVersion: batch/v1
kind: Job
metadata:
  name: garage-bootstrap
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "garage-bootstrap") | nindent 4 }}
  annotations:
    # Re-runs on every install/upgrade; the script is idempotent and waits for Garage's admin API.
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  # High so `kubectl logs job/garage-bootstrap` still works after a run; trim in Stage 19.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "copilot.podLabels" (dict "name" "garage-bootstrap") | nindent 8 }}
    spec:
      restartPolicy: OnFailure          # required for Jobs; Always is rejected
      # curlimages/curl runs as uid 100, which can't `apk add jq`. Short-lived and only talks to
      # the in-cluster admin API, so root is a small, contained trade-off.
      securityContext:
        runAsUser: 0
      containers:
        - name: bootstrap
          image: {{ .Values.waitImages.curl }}
          command: ["/bin/sh", "-c", "apk add --no-cache jq >/dev/null && /bin/sh /bootstrap/garage-bootstrap.sh"]
          env:
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.garage }}, key: garage_admin_token }
            - name: GARAGE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.garage }}, key: garage_s3_access_key_id }
            - name: GARAGE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.garage }}, key: garage_s3_secret_access_key }
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
      volumes:
        - name: bootstrap
          configMap:
            name: garage-bootstrap-script
            defaultMode: 0755
