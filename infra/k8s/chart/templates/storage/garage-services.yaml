apiVersion: v1
kind: Service
metadata:
  name: garage-headless
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "garage") | nindent 4 }}
spec:
  clusterIP: None            # headless: no VIP, DNS returns pod IPs directly
  selector:
    {{- include "copilot.selectorLabels" (dict "name" "garage") | nindent 4 }}
  ports:
    - name: s3
      port: 3900
      targetPort: 3900
    - name: rpc
      port: 3901
      targetPort: 3901
    - name: web
      port: 3902
      targetPort: 3902
    - name: admin
      port: 3903
      targetPort: 3903
---
apiVersion: v1
kind: Service
metadata:
  name: garage              # <- the name garage.toml's rpc_public_addr and the app/Job dial
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "garage") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "copilot.selectorLabels" (dict "name" "garage") | nindent 4 }}
  ports:
    - name: s3
      port: 3900
      targetPort: 3900
    - name: rpc
      port: 3901
      targetPort: 3901
    - name: web
      port: 3902
      targetPort: 3902
    - name: admin
      port: 3903
      targetPort: 3903
