apiVersion: v1
kind: Service
metadata:
  name: langfuse-web        # <- LANGFUSE_HOST (app-endpoints.env) and the port-forward target
  namespace: {{ include "copilot.namespace" . }}
  labels:
    {{- include "copilot.labels" (dict "root" $ "name" "langfuse-web") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "copilot.selectorLabels" (dict "name" "langfuse-web") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: 3000
