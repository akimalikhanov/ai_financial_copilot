# cAdvisor (see the kubernetes-cadvisor job in prometheus.yml) reports resource *usage*
# but not why a container died: its container_oom_events_total reads 0 even for pods the
# kubelet demonstrably OOMKilled under cgroup v2. kube-state-metrics reads the API server's
# object state instead, which is where the OOMKilled terminated-reason actually lives —
# along with restart counts, pod phase, and node conditions. Without it the resource alert
# rules in alert-rules.yml have nothing to match on.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: copilot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces", "services", "resourcequotas", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: copilot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: copilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
        app.kubernetes.io/component: observability
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.17.0
          args:
            # Only the collectors the alerts and the resources dashboard read. The default
            # set exports every object kind in the cluster, most of which is noise here.
            - --resources=pods,nodes,deployments,statefulsets,daemonsets,jobs
            - --namespaces=copilot
            - --metric-labels-allowlist=pods=[app.kubernetes.io/name,app.kubernetes.io/component]
          ports:
            - name: http
              containerPort: 8080
            - name: telemetry
              containerPort: 8081
          # The two health endpoints sit on different ports, and not the way round you would
          # guess: /healthz and /livez are served by the main metrics listener on 8080, while
          # /readyz is on the telemetry listener on 8081. Verified against v2.17.0 — pointing
          # either probe at the other port returns 404 and crashloops the pod.
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: "20m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: copilot
spec:
  selector:
    app.kubernetes.io/name: kube-state-metrics
  ports:
    - name: http
      port: 8080
      targetPort: 8080
