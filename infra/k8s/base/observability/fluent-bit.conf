[SERVICE]
    Flush         2
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf

# Node mode (k8s DaemonSet): tail the stdout log files the kubelet writes.
# Docker's fluentd log driver had no equivalent here — there is no
# per-container log driver in Kubernetes, so the collector reads the files
# instead of receiving a push. Path is an allowlist of only the app-tier pods
# (mirrors compose, where the fluentd driver was attached to only api /
# worker-chat / worker-ingestion — see x-app-logging in docker-compose.yml).
# A denylist here is the wrong shape: every other pod (elasticsearch,
# opensearch, postgres, redis, qdrant, ...) also logs JSON, and their schemas
# collide with the app's in ES's dynamic mapping — e.g. Elasticsearch's own
# "log.level"/"log.logger" keys get dot-expanded into a nested "log" object,
# which conflicts with the "log" field other records carry as plain text
# (raw passthrough for lines that fail the json_log parse below), and ES's
# resulting "failed to parse field [log]" errors get tailed right back in,
# feeding the loop. Keeping Path scoped to app pods avoids that class of bug
# entirely instead of trying to enumerate every noisy container.
[INPUT]
    Name              tail
    Tag               kube.*
    Path              /var/log/containers/api-*_copilot_*.log,/var/log/containers/worker-chat-*_copilot_*.log,/var/log/containers/worker-ingestion-*_copilot_*.log
    multiline.parser  cri
    DB                /var/log/flb_kube.db
    Mem_Buf_Limit     16MB
    Skip_Long_Lines   On
    Refresh_Interval  5

# Enriches records with pod name, namespace, and labels by querying the API
# server (see fluent-bit-rbac.yaml). Merge_Log is Off because the explicit
# json_log parser FILTER below handles the JSON parse. Keep_Log is Off: the raw
# "log" field is redundant once json_log unpacks it into top-level fields (it
# only matters when Merge_Log is On anyway).
[FILTER]
    Name              kubernetes
    Match             kube.*
    Kube_URL          https://kubernetes.default.svc:443
    Kube_Tag_Prefix   kube.var.log.containers.
    Merge_Log         Off
    Keep_Log          Off
    Annotations       Off
    Labels            On

# UNCHANGED from infra/docker/fluent-bit/fluent-bit.conf — after the cri parser
# strips the CRI prefix, the app's JSON line is still in the "log" key, so this
# filter ports verbatim.
[FILTER]
    Name          parser
    Match         kube.*
    Key_Name      log
    Parser        json_log
    Reserve_Data  On
    Preserve_Key  Off

# UNCHANGED — drop /metrics and /healthz access logs
[FILTER]
    Name          grep
    Match         *
    Exclude       $path ^/(metrics|healthz)/?$

# UNCHANGED except Host/Port now come from the elasticsearch Service
[OUTPUT]
    Name               es
    Match              *
    Host               ${ES_HOST}
    Port               ${ES_PORT}
    Index              copilot-logs
    Suppress_Type_Name On
    Retry_Limit        3
    Buffer_Size        5MB
