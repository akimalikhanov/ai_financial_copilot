apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: copilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      initContainers:
        # Compose gated on es-bootstrap's `service_completed_successfully`. Checking the
        # *effect* (the alias es-bootstrap creates) rather than the Job object is idempotent,
        # works on re-deploys after the Job is gone, and needs no RBAC to read Job status.
        - name: wait-for-es-bootstrap
          image: curlimages/curl:8.14.1
          command:
            - sh
            - -c
            - |
              until curl -fsS http://elasticsearch:9200/_alias/copilot-logs >/dev/null 2>&1; do
                echo "waiting for elasticsearch:9200 copilot-logs alias"; sleep 2
              done
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
      containers:
        - name: grafana
          image: grafana/grafana:12.2.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom: { secretKeyRef: { name: grafana-secret, key: GRAFANA_USER } }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: grafana-secret, key: GRAFANA_PASS } }
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_SERVER_MAX_REQUEST_SIZE
              value: "50MB"
            - name: GF_SERVER_MAX_QUERY_RESULT_SIZE
              value: "50MB"
            # Datasources provisioning expands ${VAR} natively — these four feed the
            # PostgreSQL datasource in datasources.yaml unchanged from compose.
            - name: PGB_APP_DB_HOST
              value: "pgbouncer"
            - name: PGB_APP_DB_PORT
              value: "6432"
            - name: APP_DB_USER
              valueFrom: { secretKeyRef: { name: app-secret, key: APP_DB_USER } }
            - name: APP_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secret, key: APP_DB_PASSWORD } }
            - name: APP_DB
              value: "app"
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "768Mi" }   # compose: cpus 0.50 / mem_limit 768m
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: copilot
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
