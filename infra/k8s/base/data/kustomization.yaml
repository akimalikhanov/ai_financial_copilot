apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - postgres-service.yaml
  - postgres-statefulset.yaml
  - pgbouncer-deployment.yaml
  - pgbouncer-service.yaml
  - redis-app-service.yaml
  - redis-app-statefulset.yaml
  - redis-broker-service.yaml
  - redis-broker-statefulset.yaml

# initdb/*.sh and pgbouncer-entrypoint.sh are copies of infra/scripts/db_init/*.sh and
# infra/scripts/pgbouncer-entrypoint.sh, kept under this kustomization root so
# configMapGenerator never needs --load-restrictor LoadRestrictionsNone (kustomize forbids
# referencing files above the kustomization root by default). infra/scripts/ remains the
# source of truth: run `make k8s-sync-initdb` after editing either. `make lint` (and CI)
# runs `make k8s-check-initdb` to fail loudly on drift instead of silently diverging.
configMapGenerator:
  - name: postgres-initdb
    files:
      - initdb/00_db_init.sh
      - initdb/01_create_app_tables.sh
  - name: postgres-config
    literals:
      - POSTGRES_DB=postgres
      - APP_DB=app
      - APP_DB_USER=app
      - LANGFUSE_DB=langfuse
      - LANGFUSE_DB_USER=langfuse
  - name: pgbouncer-entrypoint
    files:
      - pgbouncer-entrypoint.sh
