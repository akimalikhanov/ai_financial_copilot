apiVersion: v1
kind: Service
metadata:
  name: redis-app-headless
  namespace: copilot
spec:
  clusterIP: None            # headless: no VIP, DNS returns pod IPs directly
  selector:
    app.kubernetes.io/name: redis-app
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-app              # <- REDIS_APP_HOST, the name the api/workers dial
  namespace: copilot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis-app
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
