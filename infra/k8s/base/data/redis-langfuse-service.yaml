apiVersion: v1
kind: Service
metadata:
  name: redis-langfuse-headless
  namespace: copilot
spec:
  clusterIP: None            # headless: no VIP, DNS returns pod IPs directly
  selector:
    app.kubernetes.io/name: redis-langfuse
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-langfuse         # <- REDIS_HOST for langfuse-web and langfuse-worker
  namespace: copilot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis-langfuse
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
