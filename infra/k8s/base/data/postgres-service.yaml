apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: copilot
spec:
  clusterIP: None            # headless: no VIP, DNS returns pod IPs directly
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres              # <- the name the app/pgbouncer/langfuse dial
  namespace: copilot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
