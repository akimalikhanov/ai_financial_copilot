apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-broker
  namespace: copilot
spec:
  serviceName: redis-broker-headless     # must match the headless Service name
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-broker
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis-broker
          image: redis:7.2.12-alpine
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                # Same password as redis-app, same as compose — splitting them is scope creep.
                secretKeyRef: { name: redis-secret, key: REDIS_PASSWORD }
          command:
            - sh
            - -c
            - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
            initialDelaySeconds: 10     # compose: start_period 10s
            periodSeconds: 5            # compose: interval 5s
            timeoutSeconds: 3           # compose: timeout 3s
            failureThreshold: 15        # compose: retries 15
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
            initialDelaySeconds: 10
            periodSeconds: 20            # laxer than readiness — avoid killing a slow-starting store
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: { cpu: "125m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }   # compose: cpus 0.50 / mem_limit 512m
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
