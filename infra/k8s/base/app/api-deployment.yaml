apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: copilot
spec:
  replicas: 1
  # With a 240s grace period, never take the only replica away before its replacement is
  # ready — that would be a full outage for the length of the drain.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # Replaces compose's five `depends_on: {condition: service_healthy|service_started}`
      # entries. qdrant-hc is gone (Phase 5 retired the sidecar; qdrant's own readinessProbe
      # covers it) and fluent-bit is gone (Phase 14's DaemonSet tails node logs, so the app no
      # longer needs the collector up first — a genuine robustness improvement over compose).
      initContainers:
        - name: wait-for-pgbouncer
          image: postgres:16.11-alpine       # reuse an image that already has the client
          command:
            - sh
            - -c
            - |
              until pg_isready -h pgbouncer -p 6432 -U "$APP_DB_USER"; do
                echo "waiting for pgbouncer:6432"; sleep 2
              done
          envFrom:
            - secretRef: { name: postgres-secret }
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
        - name: wait-for-redis-app
          image: redis:7.2.12-alpine
          command:
            - sh
            - -c
            - |
              until redis-cli -h redis-app -p 6379 -a "$REDIS_PASSWORD" ping >/dev/null 2>&1; do
                echo "waiting for redis-app:6379"; sleep 2
              done
          envFrom:
            - secretRef: { name: redis-secret }
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
        - name: wait-for-redis-broker
          image: redis:7.2.12-alpine
          command:
            - sh
            - -c
            - |
              until redis-cli -h redis-broker -p 6379 -a "$REDIS_PASSWORD" ping >/dev/null 2>&1; do
                echo "waiting for redis-broker:6379"; sleep 2
              done
          envFrom:
            - secretRef: { name: redis-secret }
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
        - name: wait-for-opensearch
          image: curlimages/curl:8.14.1
          command:
            - sh
            - -c
            - |
              until curl -fsS http://opensearch:9200/_cluster/health >/dev/null 2>&1; do
                echo "waiting for opensearch:9200"; sleep 2
              done
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
        - name: wait-for-garage
          image: curlimages/curl:8.14.1
          command:
            - sh
            - -c
            - |
              # Garage's S3 endpoint 403s unauthenticated GETs (by design, no anonymous
              # access) — that's proof it's up and answering, so don't use curl -f here.
              until curl -sS -o /dev/null http://garage:3900; do
                echo "waiting for garage:3900"; sleep 2
              done
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
      # An SSE stream lives as long as the pipeline it is watching: measured chat_agent wall
      # time is p95 102s / p99 187s / max 230s (Aug-Sep 2026), so the default 30s would cut
      # most slow answers mid-stream on every deploy.
      terminationGracePeriodSeconds: 240
      containers:
        - name: api
          image: copilot/api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          lifecycle:
            preStop:
              exec:
                # Endpoint removal and SIGTERM are concurrent, not ordered, so ingress-nginx
                # and the frontend proxy can still route here for a moment after SIGTERM.
                # Sleep first, let the removal propagate, then let uvicorn start refusing.
                command: ["sh", "-c", "sleep 5"]
          # Order matters: later entries win, explicit env: below beats all of these.
          # Same precedence compose's env_file + environment: override gives.
          envFrom:
            - configMapRef: { name: app-config }      # tuning knobs
            - configMapRef: { name: app-endpoints }    # in-cluster hosts/ports
            - secretRef:    { name: app-secret }       # credentials
          env:
            - name: LOG_FILE
              value: ""
          # Liveness must be strictly laxer than readiness. Failing readiness is safe and
          # reversible (leave the endpoint list, come back); failing liveness is destructive
          # (SIGKILL, every in-flight SSE stream dropped). Sharing one endpoint and one
          # threshold — as these two did — means both fail at the same instant, so the safe
          # behaviour never happens and a Redis blip restarts the pod. Steady-state a pod
          # sheds after ~15s of failures and restarts after ~120s; the gap is the point.
          readinessProbe:
            httpGet:
              path: /readyz          # Redis reachable + below the stream cap
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3        # > the handler's own 2s Redis budget
            failureThreshold: 3      # 3 x 5s = ~15s of failures to shed
          livenessProbe:
            httpGet:
              path: /healthz         # static 200 — only "is the event loop turning"
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6      # 6 x 20s = ~120s of failures to restart
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "2000m", memory: "2Gi" }   # compose: cpus 2.00 / mem_limit 2g
---
apiVersion: v1
kind: Service
metadata:
  name: api             # in-cluster DNS name; also what port-forward targets
  namespace: copilot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
