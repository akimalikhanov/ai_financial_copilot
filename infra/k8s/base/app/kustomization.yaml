apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - api-deployment.yaml
  - frontend-deployment.yaml

configMapGenerator:
  - name: app-config
    envs: [app-config.env]      # committed — non-secret tuning knobs
  - name: app-endpoints
    envs: [app-endpoints.env]   # committed — in-cluster hosts/ports

generatorOptions:
  disableNameSuffixHash: false
