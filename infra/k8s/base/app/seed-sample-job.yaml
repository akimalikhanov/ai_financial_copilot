apiVersion: batch/v1
kind: Job
metadata:
  name: seed-sample
  namespace: copilot
spec:
  # Idempotent: a re-run on a ready corpus exits 0 at once. A failed run exits 1 and the
  # retry starts the failed document over.
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: copilot/api:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.services.sample.seed"]
          envFrom:
            - configMapRef: { name: app-config }
            - configMapRef: { name: app-endpoints }
            - secretRef:    { name: app-secret }
          env:
            - name: LOG_FILE
              value: ""
          # Importing the ingestion task module alone peaks at ~880Mi.
          resources:
            requests: { cpu: "50m", memory: "1Gi" }
            limits:   { cpu: "500m", memory: "1536Mi" }
