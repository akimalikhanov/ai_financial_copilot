apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tei-embedder-data
  namespace: copilot
spec:
  # See tei-deployment.yaml for why this is a per-Deployment PVC, not shared.
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tei-embedder
  namespace: copilot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tei-embedder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tei-embedder
        app.kubernetes.io/component: tei
    spec:
      containers:
        - name: tei-embedder
          image: ghcr.io/huggingface/text-embeddings-inference:cuda-1.8.0
          # Kept in sync with EMBED_MODEL_ID in app-config.env, which the app itself reads.
          args:
            - --model-id
            - BAAI/bge-m3
            - --dtype
            - float16
            - --max-batch-tokens
            - "16384"
            - --max-batch-requests
            - "16"
            - --max-client-batch-size
            - "64"
            - --payload-limit
            - "10000000"
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - secretRef: { name: app-secret }   # HF_TOKEN
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            requests: { cpu: "250m", memory: "2Gi" }
            limits:   { cpu: "2000m", memory: "12Gi" }   # compose: cpus 2.00 / mem_limit 12g
          # GPU is deliberately NOT requested here — same reasoning as worker-ingestion-deployment.yaml.
          # The kind overlay adds nvidia.com/gpu + the nodeSelector: overlays/kind/patches/tei-embedder-gpu.yaml.
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tei-embedder-data
---
apiVersion: v1
kind: Service
metadata:
  name: tei-embedder
  namespace: copilot
spec:
  selector:
    app.kubernetes.io/name: tei-embedder
  ports:
    - name: http
      port: 80
      targetPort: 80
