apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - clickhouse-service.yaml
  - clickhouse-statefulset.yaml
  - langfuse-web-deployment.yaml
  - langfuse-worker-deployment.yaml

# langfuse-cluster.xml is derived from infra/docker/clickhouse/config.d/langfuse-cluster.xml
# but deliberately NOT a verbatim copy, so there is no sync/drift-check target for it like
# there is for initdb and es-bootstrap: the <remote_servers> replica host must be the pod's
# headless DNS name here, where compose can use the plain service name. See the comment in the
# file. Keep the rest (Keeper, zookeeper, macros) in step with the compose version by hand.
configMapGenerator:
  - name: clickhouse-cluster-config
    files: [langfuse-cluster.xml]
  - name: langfuse-common
    envs: [langfuse-common.env]      # committed — non-secret half of x-langfuse-env

generatorOptions:
  disableNameSuffixHash: false
