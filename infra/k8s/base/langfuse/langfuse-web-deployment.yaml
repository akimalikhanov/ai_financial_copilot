apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-web
  namespace: copilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: langfuse-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langfuse-web
    spec:
      initContainers:
        # Replaces compose's four depends_on entries with one TCP-probe loop. busybox's nc
        # needs no per-service client or credentials — every dependency here only has to be
        # accepting connections before Langfuse starts its migrations.
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              for t in postgres:5432 clickhouse:8123 redis-app:6379 garage:3900; do
                until nc -z "${t%:*}" "${t#*:}"; do echo "waiting for $t"; sleep 2; done
              done
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
      containers:
        - name: langfuse-web
          image: docker.io/langfuse/langfuse:3
          envFrom:
            - configMapRef: { name: langfuse-common }
            - secretRef:    { name: clickhouse-secret }   # CLICKHOUSE_USER/PASSWORD — same
                                                          # source the ClickHouse server reads
            - secretRef:    { name: langfuse-secret }
          env:
            # Langfuse is a Next.js standalone server, which binds to $HOSTNAME. Under compose
            # that's the container name and resolves fine; in K8s it's the pod name, so the
            # server listens on the pod IP *only* and 127.0.0.1:3000 inside the netns is
            # refused — which is exactly where `kubectl port-forward` connects. In-cluster
            # traffic via the Service works either way, so this only breaks port-forward.
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXTAUTH_URL
              # What you browse to. Phase 16 exposes Langfuse by port-forward only
              # (kubectl port-forward svc/langfuse-web 3003:3000), so this is the
              # forwarded host URL, not an in-cluster name.
              value: "http://localhost:3003"
          ports:
            - name: http
              containerPort: 3000
          # Readiness only, no liveness: Prisma + ClickHouse migrations run on boot and take
          # minutes. A liveness probe that fires mid-migration leaves a half-migrated database.
          readinessProbe:
            httpGet: { path: /api/public/health, port: 3000 }
            initialDelaySeconds: 60      # compose: start_period 60s
            periodSeconds: 15            # compose: interval 15s
            timeoutSeconds: 5            # compose: timeout 5s
            failureThreshold: 20         # compose: retries 10, doubled — migrations are slow
          resources:
            # 2Gi, not compose's 1g: Node sizes its old-space heap from the cgroup limit, and
            # at 1Gi it picks ~512Mi, which this image's boot blows through — "FATAL ERROR:
            # Ineffective mark-compacts near heap limit", SIGABRT (exit 134), CrashLoop. The
            # worker has no such problem and stays at 1Gi.
            requests: { cpu: "200m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "2Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-web        # <- LANGFUSE_HOST (app-endpoints.env) and the port-forward target
  namespace: copilot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: langfuse-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
