apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: copilot
spec:
  serviceName: garage-headless     # must match the headless Service name
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: garage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage
    spec:
      containers:
        - name: garage
          image: dxflrs/garage:v2.2.0
          ports:
            - name: s3
              containerPort: 3900
            - name: rpc
              containerPort: 3901
            - name: web
              containerPort: 3902
            - name: admin
              containerPort: 3903
          volumeMounts:
            - name: meta
              mountPath: /var/lib/garage/meta
            - name: data
              mountPath: /var/lib/garage/data
            - name: garage-toml
              mountPath: /etc/garage.toml
              subPath: garage.toml
            - name: garage-secrets
              mountPath: /run/secrets
              readOnly: true
          # No compose healthcheck existed for this service; tcpSocket on the S3 port is
          # the minimal signal that Garage is actually accepting connections.
          readinessProbe:
            tcpSocket: { port: 3900 }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket: { port: 3900 }
            initialDelaySeconds: 10
            periodSeconds: 20            # laxer than readiness — avoid killing a slow-starting store
            failureThreshold: 6
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }   # compose: cpus 0.50 / mem_limit 512m
      volumes:
        - name: garage-toml
          configMap:
            name: garage-toml
        - name: garage-secrets
          secret:
            secretName: garage-secret
            defaultMode: 0o400
            items:
              - { key: garage_rpc_secret,     path: garage_rpc_secret }
              - { key: garage_admin_token,    path: garage_admin_token }
              - { key: garage_metrics_token,  path: garage_metrics_token }
  volumeClaimTemplates:
    - metadata:
        name: meta
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
