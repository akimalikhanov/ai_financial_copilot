apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-headless
  namespace: copilot
spec:
  clusterIP: None            # headless: no VIP, DNS returns pod IPs directly
  selector:
    app.kubernetes.io/name: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch          # <- the name Fluent Bit / es-bootstrap dial; 9200 in-cluster,
  namespace: copilot            #    unlike compose's host-side 9201 (no OpenSearch port clash here)
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
