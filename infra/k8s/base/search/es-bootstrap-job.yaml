apiVersion: batch/v1
kind: Job
metadata:
  name: es-bootstrap
  namespace: copilot
spec:
  backoffLimit: 6
  # High so `kubectl logs job/es-bootstrap` still works after a Complete run while developing;
  # trim once this is unattended (Stage 19).
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure          # required for Jobs; Always is rejected
      containers:
        - name: bootstrap
          image: curlimages/curl:8.14.1
          command: ["/bin/sh", "/bootstrap/bootstrap.sh"]
          env:
            - name: ES_URL
              value: "http://elasticsearch:9200"
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
      volumes:
        - name: bootstrap
          configMap:
            name: es-bootstrap-scripts
            defaultMode: 0o755
