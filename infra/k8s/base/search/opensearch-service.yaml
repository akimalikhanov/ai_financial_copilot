apiVersion: v1
kind: Service
metadata:
  name: opensearch-headless
  namespace: copilot
spec:
  clusterIP: None            # headless: no VIP, DNS returns pod IPs directly
  selector:
    app.kubernetes.io/name: opensearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
    - name: metrics
      port: 9600
      targetPort: 9600
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch              # <- the name the api/workers/dashboards dial
  namespace: copilot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opensearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
    - name: metrics
      port: 9600
      targetPort: 9600
